spring.application.name=Foster Care Tracking
server.port=8080
spring.thymeleaf.cache=false

# Force English locale so dates always render in English (e.g., "Thursday", not the system default)
spring.web.locale=en_US
spring.web.locale-resolver=fixed

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:fostercare;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
