<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign In')}"></head>
<body>
<main>
  <div class="login-wrap">
    <div class="card login">
      <p class="logo">Foster Care Tracking</p>
      <p class="sub">Sign in to continue</p>

      <div th:if="${param.error}" class="alert danger" role="alert">
        Invalid username or password.
      </div>
      <div th:if="${param.logout}" class="alert ok" role="status">
        You have been signed out.
      </div>

      <form th:action="@{/login}" method="post">
        <div class="field">
          <label for="u">Username</label>
          <input class="input" id="u" name="username" type="text"
                 autocomplete="username" placeholder="m.garcia" required>
        </div>
        <div class="field">
          <label for="p">Password</label>
          <input class="input" id="p" name="password" type="password"
                 autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn" style="display:block;width:100%;text-align:center">Sign in</button>
      </form>

      <div class="demo-box">
        <strong>Demo accounts</strong> (password: <code>demo</code>)<br>
        <ul style="margin:.5rem 0 0;padding-left:1.25rem;line-height:1.8">
          <li><strong>m.garcia</strong> — Caseworker</li>
          <li><strong>k.brown</strong> — Supervisor</li>
          <li><strong>admin</strong> — Administrator</li>
        </ul>
      </div>
    </div>
  </div>
</main>
<div th:replace="~{fragments/layout :: badge}"></div>
</body>
</html>
