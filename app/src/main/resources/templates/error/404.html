<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Page not found')}"></head>
<body>
<header class="app-header">
  <div class="inner">
    <a class="brand" href="/my-work">Foster Care Tracking</a>
  </div>
</header>
<main>

  <div class="card narrow" style="margin-top:2rem">
    <h1>Page not found</h1>
    <p class="small" th:text="'Path: ' + ${path}">Path</p>
    <p>The page you requested doesn't exist.</p>
    <div class="actions">
      <a class="btn" href="/my-work" sec:authorize="isAuthenticated()">Back to My Work</a>
      <a class="btn" href="/login" sec:authorize="!isAuthenticated()">Go to sign in</a>
    </div>
  </div>

</main>
<div class="badge">Prototype · synthetic data</div>
</body>
</html>
