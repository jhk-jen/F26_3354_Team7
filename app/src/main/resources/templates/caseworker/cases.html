<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cases')}"></head>
<body>
<header th:replace="~{fragments/layout :: appHeader(${username}, ${role})}"></header>
<main>

  <h1>Cases</h1>

  <div class="alert info" role="note">
    <span class="lbl">Note:</span>
    Case search (UC-3) is designed but not implemented in this demo.
  </div>

  <div class="card" style="padding:1rem 0">
    <div class="row spread" style="padding:0 1rem .75rem">
      <h2 style="margin:0">My cases</h2>
      <span class="small" th:text="'Showing ' + ${cases.size()} + ' open cases'">cases</span>
    </div>

    <div class="list-head">
      <span>Case</span><span>Child</span><span>Current placement</span><span>Status</span>
    </div>

    <ul class="case-list">
      <li th:each="cv : ${cases}">
        <a class="case-item"
           th:href="@{/caseworker/cases/{id}(id=${cv.caseRecord.id})}">
          <span class="case-id" th:text="${cv.caseRecord.id}">C-XXXX</span>
          <span class="c2">
            <strong th:text="${cv.caseRecord.child.name}">Child</strong>
            <span class="small" th:text="' · Child ID ' + ${cv.caseRecord.child.childId}"></span>
          </span>
          <span class="c3 small"
                th:text="${cv.currentHomeName != null ? cv.currentHomeName : 'No active placement'}">
            Home
          </span>
          <span class="c4">
            <span th:if="${cv.hasTag()}"
                  class="tag"
                  th:classappend="${cv.tagClass}"
                  th:text="${cv.tagLabel}">Tag</span>
          </span>
        </a>
      </li>
    </ul>
  </div>

</main>
<div th:replace="~{fragments/layout :: badge}"></div>
</body>
</html>
